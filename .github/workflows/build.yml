name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3 & Standalone
        run: cmake --build build --config Release --parallel

      - name: Package Windows binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/MilitantDrive-Windows | Out-Null
          Copy-Item -Recurse "build/MilitantDrive_artefacts/Release/VST3/Militant Drive.vst3" dist/MilitantDrive-Windows/
          Copy-Item "build/MilitantDrive_artefacts/Release/Standalone/Militant Drive.exe" dist/MilitantDrive-Windows/
          Compress-Archive -Path dist/MilitantDrive-Windows/* -DestinationPath MilitantDrive-Windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MilitantDrive-Windows-x64
          path: MilitantDrive-Windows-x64.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake (Universal arm64 + x86_64)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build VST3, AU & Standalone
        run: cmake --build build --config Release --parallel

      - name: Ad-hoc sign & package macOS binaries
        run: |
          mkdir -p dist/MilitantDrive-macOS
          cp -R "build/MilitantDrive_artefacts/Release/VST3/Militant Drive.vst3" dist/MilitantDrive-macOS/
          cp -R "build/MilitantDrive_artefacts/Release/AU/Militant Drive.component" dist/MilitantDrive-macOS/
          cp -R "build/MilitantDrive_artefacts/Release/Standalone/Militant Drive.app" dist/MilitantDrive-macOS/
          codesign --force --deep --sign - "dist/MilitantDrive-macOS/Militant Drive.vst3"
          codesign --force --deep --sign - "dist/MilitantDrive-macOS/Militant Drive.component"
          codesign --force --deep --sign - "dist/MilitantDrive-macOS/Militant Drive.app"
          (cd dist && zip -ry ../MilitantDrive-macOS-Universal.zip MilitantDrive-macOS)

      - uses: actions/upload-artifact@v4
        with:
          name: MilitantDrive-macOS-Universal
          path: MilitantDrive-macOS-Universal.zip

  publish-release:
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/MilitantDrive-Windows-x64.zip
            artifacts/MilitantDrive-macOS-Universal.zip
